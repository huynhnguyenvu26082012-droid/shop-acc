<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAND ACC STORE - Vòng Quay Uy Tín</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .badge {
            background: #1e293b;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 420px;
        }

        /* KHUNG NHẬP KEY */
        .key-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .key-box p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .key-input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: #4ade80;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            text-transform: uppercase;
        }

        .key-input::placeholder {
            color: #475569;
            font-size: 0.9rem;
            letter-spacing: normal;
        }

        .key-status {
            font-size: 0.8rem;
            margin-top: 6px;
            min-height: 18px;
        }

        /* VÒNG QUAY */
        .wheel-box {
            position: relative;
            width: 290px;
            height: 290px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
        }

        .btn-spin {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-spin:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .result-box h3 {
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .acc-info {
            background: #0f172a;
            border: 1px dashed #4ade80;
            color: #4ade80;
            padding: 12px;
            font-family: monospace;
            font-size: 0.95rem;
            border-radius: 8px;
            margin: 12px 0;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎯 RAND ACC STORE</h1>
        <div class="badge">⚡ Nhập Key Để Bắt Đầu Quay</div>
    </div>

    <div class="main-container">
        <!-- KHUNG NHẬP KEY LƯỢT QUAY -->
        <div class="key-box">
            <p>🔑 Nhập <b>MÃ KEY</b> bạn đã mua để quay:</p>
            <input type="text" id="keyInput" class="key-input" placeholder="NHẬP KEY VÀO ĐÂY..." oninput="checkKey()">
            <div id="keyStatus" class="key-status"></div>
        </div>

        <!-- VÒNG QUAY -->
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="290" height="290"></canvas>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="spinWheel()" disabled>NÚT QUAY ĐANG KHÓA</button>

        <!-- KẾT QUẢ QUAY -->
        <div id="resultBox" class="result-box">
            <h3>🎉 CHÚC MỪNG BẠN!</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Bạn đã quay trúng phần thưởng:</p>
            <div id="accInfo" class="acc-info">
                TK: ...<br>MK: ...
            </div>
            <p style="font-size: 0.8rem; color: #ef4444;">👉 Hãy <b>Chụp Màn Hình</b> hoặc copy Mã Trúng Thưởng gửi cho Admin để nhận Nick nhé!</p>
        </div>
    </div>

    <script>
        // ==============================================================
        // 1. DANH SÁCH KEY BẠN TẠO RA CHO KHÁCH (Mỗi key quay được 1 lần)
        // Bạn muốn bán key nào thì thêm vào danh sách bên dưới nhé!
        // ==============================================================
        let validKeys = ["KEY10K", "KEY20K", "SHOPACC999", "RANDOM888", "VIPPRO2026"];

        // ==============================================================
        // 2. KHO PHẦN THƯỞNG VÀ TỶ LỆ TRÚNG (Tổng = 100)
        // ==============================================================
        const khoAcc = [
            { loai: "Acc VIP SS",   tyLe: 10, color: "#f59e0b" }, // 10%
            { loai: "Acc VIP Vừa",  tyLe: 20, color: "#0284c7" }, // 20%
            { loai: "Acc Random",   tyLe: 40, color: "#8b5cf6" }, // 40%
            { loai: "Voucher 20%",  tyLe: 30, color: "#10b981" }  // 30%
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const keyInput = document.getElementById('keyInput');
        const keyStatus = document.getElementById('keyStatus');
        const resultBox = document.getElementById('resultBox');
        
        let currentRotation = 0;
        let isSpinning = false;
        let activeKeyIndex = -1;
        const numSlices = khoAcc.length;
        const sliceAngle = 360 / numSlices;

        // KIỂM TRA KEY NHẬP VÀO
        function checkKey() {
            if (isSpinning) return;
            const userKey = keyInput.value.trim().toUpperCase();
            activeKeyIndex = validKeys.indexOf(userKey);

            if (activeKeyIndex !== -1) {
                keyStatus.innerHTML = "<b style='color:#4ade80;'>✅ Key hợp lệ! Bấm QUAY NGAY bên dưới.</b>";
                spinBtn.disabled = false;
                spinBtn.innerText = "QUAY NGAY";
                spinBtn.style.background = "linear-gradient(135deg, #2563eb, #3b82f6)";
            } else {
                if (userKey === "") {
                    keyStatus.innerHTML = "";
                } else {
                    keyStatus.innerHTML = "<b style='color:#ef4444;'>❌ Key không tồn tại hoặc đã được sử dụng!</b>";
                }
                spinBtn.disabled = true;
                spinBtn.innerText = "NHẬP KEY ĐỂ QUAY";
                spinBtn.style.background = "#334155";
            }
        }

        // VẼ BÁNH XE
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = (i * sliceAngle - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * sliceAngle - 90) * Math.PI / 180;

                ctx.beginPath();
                ctx.fillStyle = khoAcc[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                const middleAngle = startAngle + (sliceAngle * Math.PI / 360);
                ctx.rotate(middleAngle);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(khoAcc[i].loai, radius - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // TỶ LỆ TRÚNG
        function getRewardIndexByRate() {
            let pool = [];
            khoAcc.forEach((item, index) => {
                for (let i = 0; i < item.tyLe; i++) {
                    pool.push(index);
                }
            });
            const rand = Math.floor(Math.random() * pool.length);
            return pool[rand];
        }

        // HÀM QUAY
        function spinWheel() {
            if (isSpinning || activeKeyIndex === -1) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            keyInput.disabled = true;
            resultBox.style.display = 'none';

            // XÓA KEY ĐÃ DÙNG KHỎI MẢNG (Key chỉ dùng được 1 lần)
            const usedKey = validKeys[activeKeyIndex];
            validKeys.splice(activeKeyIndex, 1); 
            activeKeyIndex = -1;

            // TÍNH GÓC QUAY CHUẨN
            const winningIndex = getRewardIndexByRate();
            const sliceCenterAngle = (winningIndex * sliceAngle) + (sliceAngle / 2);
            const stopAngle = 360 - sliceCenterAngle;
            const extraRounds = 5 * 360;
            
            const nextRotation = currentRotation + extraRounds + (stopAngle - (currentRotation % 360));
            const finalRotation = (nextRotation <= currentRotation) ? nextRotation + 360 : nextRotation;

            currentRotation = finalRotation;
            canvas.style.transform = `rotate(${finalRotation}deg)`;

            // TRẢ KẾT QUẢ SAU 4 GIÂY
            setTimeout(() => {
                isSpinning = false;
                keyInput.disabled = false;
                keyInput.value = "";
                keyStatus.innerHTML = "<b style='color:#f59e0b;'>⚠️ Key cũ đã hết lượt dùng. Nhập Key mới để quay tiếp!</b>";
                spinBtn.innerText = "NHẬP KEY ĐỂ QUAY";

                const item = khoAcc[winningIndex];
                const maRandom = "MA-" + Math.floor(100000 + Math.random() * 900000);

                document.getElementById('accInfo').innerHTML = `
                    <b>Phần thưởng:</b> ${item.loai}<br>
                    <b>Mã Trúng Thưởng:</b> <span style="color:#f59e0b">${maRandom}</span><br>
                    <b>Tài khoản / Mật khẩu:</b> Liên hệ Admin để nhận Nick
                `;
                resultBox.style.display = 'block';
            }, 4000);
        }
    </script>
</body>
</html>
