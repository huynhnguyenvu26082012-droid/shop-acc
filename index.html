<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Acc Random Tự Động</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8; --accent-gold: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 10px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; color: var(--accent-color); margin-bottom: 8px; }
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 450px; }
        .wheel-box { position: relative; width: 290px; height: 290px; display: flex; justify-content: center; align-items: center; background: var(--card-bg); border-radius: 50%; border: 4px solid var(--border-color); }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ef4444; z-index: 10; }
        canvas { border-radius: 50%; transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1); }
        .btn-spin { background: #3b82f6; color: white; border: none; padding: 14px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; text-transform: uppercase; }
        .btn-spin:disabled { background: #64748b; cursor: not-allowed; }
        .result-box { display: none; width: 100%; background: var(--card-bg); border: 2px solid var(--accent-gold); border-radius: 12px; padding: 20px; text-align: center; }
        .result-box h3 { color: var(--accent-gold); margin-bottom: 10px; }
        .acc-info { background: #0f172a; border: 1px dashed #4ade80; color: #4ade80; padding: 12px; font-family: monospace; font-size: 1rem; border-radius: 6px; margin: 10px 0; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 RAND ACC STORE</h1>
        <p>Quay Ngẫu Nhiên - Nhận Nick Ngay</p>
    </div>
    <div class="main-container">
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="280" height="280"></canvas>
        </div>
        <button id="spinBtn" class="btn-spin" onclick="spinWheel()">QUAY NGAY</button>
        <div id="resultBox" class="result-box">
            <h3>🎉 CHÚC MỪNG BẠN!</h3>
            <p style="font-size: 0.9rem; color: #94a3b8;">Thông tin tài khoản ngẫu nhiên của bạn:</p>
            <div id="accInfo" class="acc-info">
                TK: ...<br>MK: ...
            </div>
            <p style="font-size: 0.8rem; color: #ef4444;">⚠️ Hãy chụp màn hình hoặc lưu lại ngay!</p>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // KHO ACC VÀ TỶ LỆ TRÚNG CHUẨN (Tổng tỉ lệ 100%)
        // Bạn có thể sửa TK / MK / Tỷ Lệ (tyLe) ở đoạn này!
        // -------------------------------------------------------------
        const khoAcc = [
            { tk: "acc_vip_ss_01", mk: "passss999", loai: "Acc VIP SS", tyLe: 10 },  // Đúng 10%
            { tk: "user_rand01", mk: "pass123456", loai: "Acc Random #1", tyLe: 30 }, // 30%
            { tk: "user_rand02", mk: "pass654321", loai: "Acc Random #2", tyLe: 30 }, // 30%
            { tk: "user_rand03", mk: "passabcdef", loai: "Acc Random #3", tyLe: 30 }  // 30%
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultBox = document.getElementById('resultBox');
        let currentRotation = 0, isSpinning = false;

        function drawWheel() {
            const numSlices = khoAcc.length, sliceAngle = (2 * Math.PI) / numSlices;
            const centerX = canvas.width / 2, centerY = canvas.height / 2, radius = canvas.width / 2 - 5;
            const colors = ["#f59e0b", "#0284c7", "#7c3aed", "#16a34a"];

            for (let i = 0; i < numSlices; i++) {
                const angle = i * sliceAngle;
                ctx.beginPath(); ctx.fillStyle = colors[i % colors.length]; ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.stroke();
                ctx.save(); ctx.translate(centerX, centerY); ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right"; ctx.fillStyle = "#ffffff"; ctx.font = "bold 11px sans-serif";
                ctx.fillText(khoAcc[i].loai, radius - 15, 5); ctx.restore();
            }
        }
        drawWheel();

        // THUẬT TOÁN BỐC LÁ PHIẾU CHUẨN TỶ LỆ (POOL 100 Ô)
        function quayTheoTyLe() {
            let pool = [];
            khoAcc.forEach((item, index) => {
                for (let i = 0; i < item.tyLe; i++) {
                    pool.push(index);
                }
            });
            const randIndex = Math.floor(Math.random() * pool.length);
            return pool[randIndex];
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true; spinBtn.disabled = true; resultBox.style.display = 'none';

            const selectedIndex = quayTheoTyLe();
            const sliceAngle = 360 / khoAcc.length;
            const targetAngle = 360 - (selectedIndex * sliceAngle + sliceAngle / 2);
            const totalRotation = currentRotation + (5 * 360) + (targetAngle - (currentRotation % 360));
            
            currentRotation = totalRotation;
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false; spinBtn.disabled = false;
                const item = khoAcc[selectedIndex];
                
                document.getElementById('accInfo').innerHTML = `
                    <b>Loại Quà:</b> ${item.loai}<br>
                    <b>Tài khoản:</b> ${item.tk}<br>
                    <b>Mật khẩu:</b> ${item.mk}
                `;
                resultBox.style.display = 'block';
            }, 4000);
        }
    </script>
</body>
</html>
