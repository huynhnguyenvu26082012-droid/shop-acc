<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAND ACC STORE - Vòng Quay Uy Tín</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .badge {
            background: #1e293b;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 420px;
        }

        .key-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .key-box p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .key-input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: #4ade80;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            text-transform: uppercase;
        }

        .key-status {
            font-size: 0.8rem;
            margin-top: 6px;
            min-height: 18px;
        }

        .wheel-box {
            position: relative;
            width: 290px;
            height: 290px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            /* Thời gian quay 30 giây cực kịch tính */
            transition: transform 30s cubic-bezier(0.1, 0.85, 0.15, 1);
        }

        .btn-spin {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-spin:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .result-box h3 {
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .acc-info {
            background: #0f172a;
            border: 1px dashed #4ade80;
            color: #4ade80;
            padding: 12px;
            font-family: monospace;
            font-size: 0.95rem;
            border-radius: 8px;
            margin: 12px 0;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎯 RAND ACC STORE</h1>
        <div class="badge">⚡ Hệ Thống Kiểm Tra Key Tự Động</div>
    </div>

    <div class="main-container">
        <div class="key-box">
            <p>🔑 Nhập <b>MÃ KEY</b> để kiểm tra và quay:</p>
            <input type="text" id="keyInput" class="key-input" placeholder="NHẬP KEY..." oninput="checkKeyWithServer()">
            <div id="keyStatus" class="key-status"></div>
        </div>

        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="290" height="290"></canvas>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="spinWheel()" disabled>NHẬP KEY ĐỂ QUAY</button>

        <div id="resultBox" class="result-box">
            <h3>🎉 CHÚC MỪNG BẠN!</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Bạn đã quay trúng phần thưởng:</p>
            <div id="accInfo" class="acc-info">
                TK: ...<br>MK: ...
            </div>
            <p style="font-size: 0.8rem; color: #ef4444;">👉 Hãy <b>Chụp Màn Hình</b> hoặc copy Mã Trúng Thưởng gửi cho Admin để nhận Nick nhé!</p>
        </div>
    </div>

    <script>
        // ==============================================================
        // DÁN URL GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA DẤU NGOẶC KÉP NÀY:
        // ==============================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPnB6Vk1TKgB146Q3trQIyWOjb6lpxvW6YxU3m3Lnypy7AF4xvjyfJVVs4nA2vDG7Dkg/exec";

        // Cấu hình tỷ lệ trúng mới
        const khoAcc = [
            { loai: "Acc VIP SS",   tyLe: 5,  color: "#f59e0b" }, // 5%
            { loai: "Acc VIP Vừa",  tyLe: 5,  color: "#0284c7" }, // 5%
            { loai: "Acc Random",   tyLe: 50, color: "#8b5cf6" }, // 50%
            { loai: "Voucher 20%",  tyLe: 40, color: "#10b981" }  // 40%
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const keyInput = document.getElementById('keyInput');
        const keyStatus = document.getElementById('keyStatus');
        const resultBox = document.getElementById('resultBox');
        
        let currentRotation = 0;
        let isSpinning = false;
        let isKeyValid = false;
        let checkTimeout = null;
        let soundInterval = null;
        const numSlices = khoAcc.length;
        const sliceAngle = 360 / numSlices;

        // BỘ TẠO ÂM THANH (WEB AUDIO API)
        let audioCtx = null;

        function playTickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.4);
                });
            } catch (e) {}
        }

        // KIỂM TRA KEY TRÊN GOOGLE SHEETS
        function checkKeyWithServer() {
            if (isSpinning) return;
            const userKey = keyInput.value.trim();
            
            isKeyValid = false;
            spinBtn.disabled = true;
            spinBtn.innerText = "ĐANG KIỂM TRA KEY...";

            if (userKey === "") {
                keyStatus.innerHTML = "";
                spinBtn.innerText = "NHẬP KEY ĐỂ QUAY";
                return;
            }

            clearTimeout(checkTimeout);
            checkTimeout = setTimeout(() => {
                keyStatus.innerHTML = "<span style='color:#94a3b8;'>⏳ Đang check dữ liệu...</span>";

                fetch(`${SCRIPT_URL}?key=${encodeURIComponent(userKey)}&action=check`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        keyStatus.innerHTML = "<b style='color:#4ade80;'>✅ Key hợp lệ! Bấm QUAY NGAY bên dưới.</b>";
                        isKeyValid = true;
                        spinBtn.disabled = false;
                        spinBtn.innerText = "QUAY NGAY";
                    } else {
                        keyStatus.innerHTML = `<b style='color:#ef4444;'>❌ ${data.message}</b>`;
                        spinBtn.innerText = "KEY KHÔNG HỢP LỆ";
                    }
                })
                .catch(err => {
                    keyStatus.innerHTML = "<b style='color:#ef4444;'>❌ Lỗi kết nối máy chủ! Kiểm tra lại URL Script.</b>";
                    spinBtn.innerText = "LỖI KẾT NỐI";
                });
            }, 500);
        }

        // VẼ BÁNH XE
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = (i * sliceAngle - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * sliceAngle - 90) * Math.PI / 180;

                ctx.beginPath();
                ctx.fillStyle = khoAcc[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                const middleAngle = startAngle + (sliceAngle * Math.PI / 360);
                ctx.rotate(middleAngle);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(khoAcc[i].loai, radius - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        function getRewardIndexByRate() {
            let pool = [];
            khoAcc.forEach((item, index) => {
                for (let i = 0; i < item.tyLe; i++) {
                    pool.push(index);
                }
            });
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // HÀM TẠO TIẾNG TẠCH TẠCH CHẬM DẦN THEO 30S
        function startSpinSound() {
            let lastAngle = 0;
            let checkSound = () => {
                if (!isSpinning) return;
                const st = window.getComputedStyle(canvas);
                const tr = st.getPropertyValue("transform");
                if (tr && tr !== "none") {
                    const values = tr.split('(')[1].split(')')[0].split(',');
                    const a = parseFloat(values[0]);
                    const b = parseFloat(values[1]);
                    let angle = Math.atan2(b, a) * (180 / Math.PI);
                    if (angle < 0) angle += 360;
                    
                    if (Math.abs(angle - lastAngle) >= 30) {
                        playTickSound();
                        lastAngle = angle;
                    }
                }
                soundInterval = requestAnimationFrame(checkSound);
            };
            soundInterval = requestAnimationFrame(checkSound);
        }

        // HÀM QUAY 30 GIÂY
        function spinWheel() {
            if (isSpinning || !isKeyValid) return;
            
            const userKey = keyInput.value.trim();
            isSpinning = true;
            spinBtn.disabled = true;
            keyInput.disabled = true;
            resultBox.style.display = 'none';

            fetch(`${SCRIPT_URL}?key=${encodeURIComponent(userKey)}&action=use`)
            .then(res => res.json())
            .then(data => {
                if (data.status !== "success") {
                    alert("Key này đã bị sử dụng ở nơi khác!");
                    location.reload();
                    return;
                }

                // TÍNH GÓC QUAY 35 VÒNG (30 GIÂY)
                const winningIndex = getRewardIndexByRate();
                const sliceCenterAngle = (winningIndex * sliceAngle) + (sliceAngle / 2);
                const stopAngle = 360 - sliceCenterAngle;
                const extraRounds = 35 * 360; // Quay 35 vòng
                
                const nextRotation = currentRotation + extraRounds + (stopAngle - (currentRotation % 360));
                const finalRotation = (nextRotation <= currentRotation) ? nextRotation + 360 : nextRotation;

                currentRotation = finalRotation;
                canvas.style.transform = `rotate(${finalRotation}deg)`;

                // KÍCH HOẠT ÂM THANH
                startSpinSound();

                // DỪNG LẠI ĐÚNG SAU 30 GIÂY (30000ms)
                setTimeout(() => {
                    isSpinning = false;
                    cancelAnimationFrame(soundInterval);
                    playWinSound(); // Nhạc chiến thắng

                    keyInput.disabled = false;
                    keyInput.value = "";
                    keyStatus.innerHTML = "<b style='color:#f59e0b;'>⚠️ Key đã được gạch thẻ thành công. Nhập Key mới để quay tiếp!</b>";
                    spinBtn.innerText = "NHẬP KEY ĐỂ QUAY";

                    const item = khoAcc[winningIndex];
                    const maRandom = "MA-" + Math.floor(100000 + Math.random() * 900000);

                    document.getElementById('accInfo').innerHTML = `
                        <b>Phần thưởng:</b> ${item.loai}<br>
                        <b>Mã Trúng Thưởng:</b> <span style="color:#f59e0b">${maRandom}</span><br>
                        <b>Tài khoản / Mật khẩu:</b> Liên hệ Admin để nhận Nick
                    `;
                    resultBox.style.display = 'block';
                }, 30000);
            });
        }
    </script>
</body>
</html>
