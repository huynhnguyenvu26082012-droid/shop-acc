<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAND ACC STORE - Vòng Quay Uy Tín</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --accent-gold: #d97706;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 6px;
            font-weight: 800;
        }

        .badge {
            background: #e0e7ff;
            border: 1px solid #c7d2fe;
            color: #4338ca;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 440px;
        }

        .key-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .key-box p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .key-input {
            width: 100%;
            padding: 12px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .key-input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .key-status {
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 20px;
        }

        .wheel-box {
            position: relative;
            width: 310px;
            height: 310px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* KIM ĐỎ VỚI HIỆU ỨNG NẢY KHI CHẠM RANH GIỚI Ô */
        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 28px solid #dc2626;
            z-index: 10;
            filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.3));
            transform-origin: top center;
            transition: transform 0.04s ease-out;
        }

        /* Lớp CSS giúp kim giật nhẹ khi cạch */
        .pointer.tick {
            transform: translateX(-50%) rotate(-15deg);
        }

        canvas {
            border-radius: 50%;
            transition: transform 15s cubic-bezier(0.15, 0.85, 0.35, 1.04);
        }

        .btn-spin {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-spin:active {
            transform: scale(0.98);
        }

        .btn-spin:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* POPUP KẾT QUẢ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card h2 {
            color: #d97706;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .acc-info {
            background: #f8fafc;
            border: 2px dashed #22c55e;
            color: #15803d;
            padding: 14px;
            font-family: monospace;
            font-size: 1rem;
            border-radius: 12px;
            margin: 15px 0;
            text-align: left;
            line-height: 1.6;
        }

        .btn-close {
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎯 RAND ACC STORE</h1>
        <div class="badge">⚡ Vòng Quay Thử Vận May</div>
    </div>

    <div class="main-container">
        <div class="key-box">
            <p>🔑 Nhập <b>MÃ KEY</b> để khởi động vòng quay:</p>
            <input type="text" id="keyInput" class="key-input" placeholder="NHẬP KEY..." oninput="checkKeyWithServer()">
            <div id="keyStatus" class="key-status"></div>
        </div>

        <div class="wheel-box">
            <div id="pointer" class="pointer"></div>
            <canvas id="wheelCanvas" width="290" height="290"></canvas>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="spinWheel()" disabled>NHẬP KEY ĐỂ QUAY</button>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <h2>🎉 CHÚC MỪNG BẠN!</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Bạn đã quay trúng phần thưởng:</p>
            <div id="accInfo" class="acc-info">
                TK: ...<br>MK: ...
            </div>
            <p style="font-size: 0.8rem; color: #dc2626; font-weight: 600;">👉 Chụp màn hình gửi Admin ngay để nhận thưởng!</p>
            <button class="btn-close" onclick="closeModal()">Đóng & Tiếp Tục</button>
        </div>
    </div>

    <script>
        // ==============================================================
        // DÁN URL GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA DẤU NGOẶC KÉP NÀY:
        // ==============================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPnB6Vk1TKgB146Q3trQIyWOjb6lpxvW6YxU3m3Lnypy7AF4xvjyfJVVs4nA2vDG7Dkg/exec";

        const khoAcc = [
            { loai: "Acc VIP SS",   tyLe: 5,  color: "#f59e0b" },
            { loai: "Acc VIP Vừa",  tyLe: 5,  color: "#0284c7" },
            { loai: "Acc Random",   tyLe: 50, color: "#8b5cf6" },
            { loai: "Voucher 20%",  tyLe: 40, color: "#10b981" }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const keyInput = document.getElementById('keyInput');
        const keyStatus = document.getElementById('keyStatus');
        const modalOverlay = document.getElementById('modalOverlay');
        const pointer = document.getElementById('pointer');
        
        let currentRotation = 0;
        let isSpinning = false;
        let isKeyValid = false;
        let checkTimeout = null;
        let soundInterval = null;
        const numSlices = khoAcc.length;
        const sliceAngle = 360 / numSlices;

        // BỘ ÂM THANH "CẠCH" CƠ KHÍ GIỐNG WHEEL OF NAMES 100%
        let audioCtx = null;

        function playTickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                // Tiếng đập "Cạch" đục và giòn
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.015);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.015);

                // Hiệu ứng kim đỏ nảy rung
                pointer.classList.remove('tick');
                void pointer.offsetWidth; // Trigger reflow
                pointer.classList.add('tick');
                setTimeout(() => pointer.classList.remove('tick'), 40);

            } catch (e) {}
        }

        function playWinSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.25, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });
            } catch (e) {}
        }

        // KIỂM TRA KEY TRÊN GOOGLE SHEETS
        function checkKeyWithServer() {
            if (isSpinning) return;
            const userKey = keyInput.value.trim();
            
            isKeyValid = false;
            spinBtn.disabled = true;
            spinBtn.innerText = "ĐANG KIỂM TRA KEY...";

            if (userKey === "") {
                keyStatus.innerHTML = "";
                spinBtn.innerText = "NHẬP KEY ĐỂ QUAY";
                return;
            }

            clearTimeout(checkTimeout);
            checkTimeout = setTimeout(() => {
                keyStatus.innerHTML = "<span style='color:#64748b;'>⏳ Đang kết nối máy chủ...</span>";

                fetch(`${SCRIPT_URL}?key=${encodeURIComponent(userKey)}&action=check`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        keyStatus.innerHTML = "<b style='color:#16a34a;'>✅ Key hợp lệ! Bấm QUAY NGAY.</b>";
                        isKeyValid = true;
                        spinBtn.disabled = false;
                        spinBtn.innerText = "QUAY NGAY";
                    } else {
                        keyStatus.innerHTML = `<b style='color:#dc2626;'>❌ ${data.message}</b>`;
                        spinBtn.innerText = "KEY KHÔNG HỢP LỆ";
                    }
                })
                .catch(err => {
                    keyStatus.innerHTML = "<b style='color:#dc2626;'>❌ Lỗi kết nối máy chủ! Kiểm tra URL Script.</b>";
                    spinBtn.innerText = "LỖI KẾT NỐI";
                });
            }, 500);
        }

        // VẼ BÁNH XE
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 4;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                const startAngle = (i * sliceAngle - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * sliceAngle - 90) * Math.PI / 180;

                ctx.beginPath();
                ctx.fillStyle = khoAcc[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                const middleAngle = startAngle + (sliceAngle * Math.PI / 360);
                ctx.rotate(middleAngle);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px sans-serif";
                ctx.fillText(khoAcc[i].loai, radius - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        function getRewardIndexByRate() {
            let pool = [];
            khoAcc.forEach((item, index) => {
                for (let i = 0; i < item.tyLe; i++) {
                    pool.push(index);
                }
            });
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // BẮT CHÍNH XÁC KHOẢNH KHẮC CẮT BỞI RANH GIỚI Ô ĐỂ PHÁT TIẾNG CẠCH
        function startSpinSound() {
            let lastSliceIndex = -1;
            
            let checkSound = () => {
                if (!isSpinning) return;
                const st = window.getComputedStyle(canvas);
                const tr = st.getPropertyValue("transform");
                if (tr && tr !== "none") {
                    const values = tr.split('(')[1].split(')')[0].split(',');
                    const a = parseFloat(values[0]);
                    const b = parseFloat(values[1]);
                    let angle = Math.atan2(b, a) * (180 / Math.PI);
                    if (angle < 0) angle += 360;
                    
                    // Tính ô hiện tại đang nằm dưới kim đỏ (đặt ở góc 270 độ / top)
                    let currentSlice = Math.floor(((360 - angle) % 360) / sliceAngle);
                    
                    if (currentSlice !== lastSliceIndex) {
                        playTickSound();
                        lastSliceIndex = currentSlice;
                    }
                }
                soundInterval = requestAnimationFrame(checkSound);
            };
            soundInterval = requestAnimationFrame(checkSound);
        }

        // HÀM QUAY
        function spinWheel() {
            if (isSpinning || !isKeyValid) return;
            
            const userKey = keyInput.value.trim();
            isSpinning = true;
            spinBtn.disabled = true;
            keyInput.disabled = true;

            fetch(`${SCRIPT_URL}?key=${encodeURIComponent(userKey)}&action=use`)
            .then(res => res.json())
            .then(data => {
                if (data.status !== "success") {
                    alert("Key này đã được sử dụng!");
                    location.reload();
                    return;
                }

                const winningIndex = getRewardIndexByRate();
                const sliceCenterAngle = (winningIndex * sliceAngle) + (sliceAngle / 2);
                const stopAngle = 360 - sliceCenterAngle;
                const extraRounds = 20 * 360;
                
                const nextRotation = currentRotation + extraRounds + (stopAngle - (currentRotation % 360));
                const finalRotation = (nextRotation <= currentRotation) ? nextRotation + 360 : nextRotation;

                currentRotation = finalRotation;
                canvas.style.transform = `rotate(${finalRotation}deg)`;

                startSpinSound();

                setTimeout(() => {
                    isSpinning = false;
                    cancelAnimationFrame(soundInterval);
                    playWinSound();

                    keyInput.disabled = false;
                    keyInput.value = "";
                    keyStatus.innerHTML = "<b style='color:#d97706;'>⚠️ Key đã gạch thẻ thành công. Nhập Key mới để tiếp tục!</b>";
                    spinBtn.innerText = "NHẬP KEY ĐỂ QUAY";

                    const item = khoAcc[winningIndex];
                    const maRandom = "MA-" + Math.floor(100000 + Math.random() * 900000);

                    document.getElementById('accInfo').innerHTML = `
                        <b>Phần thưởng:</b> ${item.loai}<br>
                        <b>Mã Trúng:</b> <span style="color:#d97706">${maRandom}</span><br>
                        <b>Tài khoản / MK:</b> Liên hệ Admin
                    `;
                    modalOverlay.style.display = 'flex';
                }, 15000);
            });
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }
    </script>
</body>
</html>
