<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAND ACC STORE - Vòng Quay Uy Tín</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .badge {
            background: #1e293b;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 420px;
        }

        .wheel-box {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
        }

        .btn-spin {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-spin:disabled {
            background: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .result-box h3 {
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .acc-info {
            background: #0f172a;
            border: 1px dashed #4ade80;
            color: #4ade80;
            padding: 12px;
            font-family: monospace;
            font-size: 0.95rem;
            border-radius: 8px;
            margin: 12px 0;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎯 RAND ACC STORE</h1>
        <div class="badge">⚡ Tỉ Lệ Chuẩn - Nhận Acc Tự Động</div>
    </div>

    <div class="main-container">
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="spinWheel()">QUAY NGAY</button>

        <div id="resultBox" class="result-box">
            <h3>🎉 CHÚC MỪNG BẠN!</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Bạn đã quay trúng phần thưởng:</p>
            <div id="accInfo" class="acc-info">
                TK: ...<br>MK: ...
            </div>
            <p style="font-size: 0.8rem; color: #ef4444;">⚠️ LƯU Ý: Chụp màn hình hoặc chép lại mật khẩu ngay!</p>
        </div>
    </div>

    <script>
        // ==============================================================
        // KHO ACC & PHẦN THƯỞNG (TỔNG TỶ LỆ = 100)
        // Sửa TK / MK / Tỷ Lệ (tyLe) trực tiếp tại đây
        // ==============================================================
        const khoAcc = [
            { loai: "Acc VIP SS",   tk: "acc_ss_100k",  mk: "passvip999",   tyLe: 10, color: "#f59e0b" }, // 10%
            { loai: "Acc VIP Vừa",  tk: "acc_vua_50k",  mk: "passvua123",   tyLe: 20, color: "#0284c7" }, // 20%
            { loai: "Acc Random",   tk: "acc_rand_20k", mk: "passrand789",  tyLe: 40, color: "#8b5cf6" }, // 40%
            { loai: "Voucher 20%",  tk: "MÃ VC:",       mk: "VC20-DISCOUNT",tyLe: 30, color: "#10b981" }  // 30%
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultBox = document.getElementById('resultBox');
        
        let currentRotation = 0; // Tích lũy góc quay tổng cộng
        let isSpinning = false;
        const numSlices = khoAcc.length;
        const sliceAngle = 360 / numSlices; // 90 độ / ô

        // Vẽ bánh xe
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 5;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSlices; i++) {
                // Vẽ từ đỉnh (12h - tức -90 độ) theo chiều kim đồng hồ
                const startAngle = (i * sliceAngle - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * sliceAngle - 90) * Math.PI / 180;

                ctx.beginPath();
                ctx.fillStyle = khoAcc[i].color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Vẽ chữ giữa ô
                ctx.save();
                ctx.translate(centerX, centerY);
                const middleAngle = startAngle + (sliceAngle * Math.PI / 360);
                ctx.rotate(middleAngle);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(khoAcc[i].loai, radius - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        // Thuật toán chọn chỉ số theo Tỷ lệ %
        function getRewardIndexByRate() {
            let pool = [];
            khoAcc.forEach((item, index) => {
                for (let i = 0; i < item.tyLe; i++) {
                    pool.push(index);
                }
            });
            const rand = Math.floor(Math.random() * pool.length);
            return pool[rand];
        }

        // Hàm Quay chuẩn góc 100%
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultBox.style.display = 'none';

            // 1. Chọn món quà theo tỷ lệ %
            const winningIndex = getRewardIndexByRate();

            // 2. Tính góc quay chuẩn:
            // Kim đỏ ở trên cùng (12h) tương ứng với góc 0 deg của container
            // Ô thứ i nằm trong khoảng góc [i * 90, (i+1) * 90] tính theo chiều kim đồng hồ.
            // Để đưa giữa ô thứ i lên vị trí 12h, ta cần quay bánh xe một góc theo chiều kim đồng hồ:
            // Angle = 360 - (i * 90 + 45)
            const sliceCenterAngle = (winningIndex * sliceAngle) + (sliceAngle / 2);
            const stopAngle = 360 - sliceCenterAngle;

            // Cộng thêm ít nhất 5 vòng quay (5 * 360)
            const extraRounds = 5 * 360;
            
            // Tính tổng độ quay mới dựa trên góc hiện tại
            const nextRotation = currentRotation + extraRounds + (stopAngle - (currentRotation % 360));
            // Đảm bảo luôn quay tiến tới (không bị giật lùi)
            const finalRotation = (nextRotation <= currentRotation) ? nextRotation + 360 : nextRotation;

            currentRotation = finalRotation;
            canvas.style.transform = `rotate(${finalRotation}deg)`;

            // 3. Sau 4 giây hoàn thành quay
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                const item = khoAcc[winningIndex];
                document.getElementById('accInfo').innerHTML = `
                    <b>Phần thưởng:</b> ${item.loai}<br>
                    <b>Tài khoản / Mã:</b> ${item.tk}<br>
                    <b>Mật khẩu / Chi tiết:</b> ${item.mk}
                `;
                resultBox.style.display = 'block';
            }, 4000);
        }
    </script>
</body>
</html>
